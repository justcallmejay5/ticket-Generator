
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for Coding Conf 2026.">
    <title>Coding Conf 2026 | Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">
        <a href="index.html" class="brand" aria-label="Coding Conf home">
            <img src="assets/images/logo-full.svg" alt="Coding Conf">
        </a>
    </header>

    <main class="registration-main">

        <section class="form-heading">
            <h1>Your Journey to Coding Conf 2026 Starts Here!</h1>

            <p>
                Complete the form below to register for the conference
                and receive your personalised digital ticket.
            </p>
        </section>

        <form id="registrationForm" class="registration-form" novalidate>

            <div class="form-group">
                <label for="fullName">Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    aria-describedby="nameError"
                >

                <small class="error-message" id="nameError" aria-live="polite"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="text"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    aria-describedby="emailError"
                >

                <small class="error-message" id="emailError" aria-live="polite"></small>
            </div>

            <div class="form-group">
                <label for="github">GitHub Username</label>

                <input
                    type="text"
                    id="github"
                    name="github"
                    placeholder="@yourusername"
                    aria-describedby="githubError"
                >

                <small class="error-message" id="githubError" aria-live="polite"></small>
            </div>

            <div class="form-group">
                <label for="avatar">Upload Profile Picture</label>

                <div class="upload-area">
                    <img
                        src="assets/images/icon-upload.svg"
                        alt=""
                        class="upload-icon"
                    >

                    <input
                        type="file"
                        id="avatar"
                        name="avatar"
                        accept=".jpg,.jpeg,.png,image/jpeg,image/png"
                        aria-describedby="avatarError uploadHint"
                    >

                    <p id="uploadHint">
                        Upload a JPEG or PNG image (maximum 500KB).
                    </p>
                </div>

                <small class="error-message" id="avatarError" aria-live="polite"></small>

                <p class="upload-note">
                    <img src="assets/images/icon-info.svg" alt="">
                    Image must be smaller than 500KB.
                </p>
            </div>

            <button type="submit" class="primary-button submit-button">
                Generate My Ticket
                <span aria-hidden="true">→</span>
            </button>

            <p class="back-link">
                <a href="index.html">← Back to homepage</a>
            </p>

        </form>

    </main>

    <footer class="site-footer">
        <p>© 2026 Coding Conf. All rights reserved.</p>
    </footer>

    <script src="js/validation.js"></script>

</body>
</html>
